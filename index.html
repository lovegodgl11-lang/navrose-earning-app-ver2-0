const compressImageToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = reject;
    reader.onload = (event) => {
        if (event.target && typeof event.target.result === 'string') {
            const img = new Image();
            img.src = event.target.result;
            img.onerror = reject;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 800;
                const scaleSize = maxWidth / img.width;
                canvas.width = maxWidth;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                } else {
                    reject(new Error('Could not get canvas context.'));
                }
            };
        } else {
            reject(new Error('FileReader result is not a string.'));
        }
    };
});

    return (

};


// --- CHATBOT MODAL ---
const ChatbotModal = ({ show, onClose }) => {
    const [messages, setMessages] = useState([
        { sender: 'bot', text: "Hi! Welcome to Navrose Support. How can I help you today? You can ask about orders, ads, or your freelance profile." }
    ]);
    const [inputValue, setInputValue] = useState('');
    const messagesEndRef = useRef(null);

    const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
    };

    useEffect(scrollToBottom, [messages]);

    const generateBotResponse = (userInput) => {
        const lowerInput = userInput.toLowerCase();
        
        const adminContactLink = `<a href="https://wa.me/917696272780" target="_blank" rel="noopener noreferrer">contact our admin on WhatsApp</a>`;

        if (lowerInput.includes('order') || lowerInput.includes('delivery') || lowerInput.includes('status')) {
            return "You can check your order status on the 'My Orders' page from the user menu. If you have a specific query, please provide your Order ID when you " + adminContactLink + ".";
        }
        if (lowerInput.includes('freelance') || lowerInput.includes('profile')) {
            return "You can create or view your freelance profile from the user menu (click your profile icon). Profiles are typically approved by our team within 24 hours.";
        }
        if (lowerInput.includes('ad') || lowerInput.includes('post') || lowerInput.includes('sell')) {
            return "To post an ad, click on your profile icon in the top right and select 'Post New Ad'. Your ad will become visible after it has been approved by our admin team.";
        }
        if (lowerInput.includes('payment') || lowerInput.includes('upi') || lowerInput.includes('pay')) {
            return "We accept payments via UPI. You can find the UPI ID and a QR code on the payment screen when you proceed to checkout from your cart.";
        }
        if (lowerInput.includes('hello') || lowerInput.includes('hi') || lowerInput.includes('hey')) {
            return "Hello! How can I assist you?";
        }

        return "I'm sorry, I couldn't understand that. For more specific questions, please " + adminContactLink + ". Our team will be happy to assist you.";
    };

    const handleSendMessage = (e) => {
        e.preventDefault();
        const trimmedInput = inputValue.trim();
        if (!trimmedInput) return;

        const userMessage = { sender: 'user', text: trimmedInput };
        setMessages(prev => [...prev, userMessage]);
        setInputValue('');

        setTimeout(() => {
            const botResponseText = generateBotResponse(trimmedInput);
            const botMessage = { sender: 'bot', text: botResponseText };
            setMessages(prev => [...prev, botMessage]);
        }, 500); // Simulate bot "thinking"
    };

    if (!show) return null;

    return (
        <div className="modal-overlay chatbot-modal-overlay">
            <div className="modal-content chatbot-modal-content">
                <div className="chatbot-header">
                    <h3>Navrose Support</h3>
                    <button className="modal-close-btn" onClick={onClose}>&times;</button>
                </div>
                <div className="chatbot-messages">
                    {messages.map((msg, index) => (
                        <div key={index} className={`message-bubble-wrapper ${msg.sender}-wrapper`}>
                           <div className={`message-bubble ${msg.sender}-message`}>
                                <span dangerouslySetInnerHTML={{ __html: msg.text }}></span>
                           </div>
                        </div>
                    ))}
                    <div ref={messagesEndRef} />
                </div>
                <form className="chatbot-input-area" onSubmit={handleSendMessage}>
                    <input
                        type="text"
                        value={inputValue}
                        onChange={(e) => setInputValue(e.target.value)}
                        placeholder="Type your message..."
                        autoFocus
                    />
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    );
};

const Header = ({ currentUser, onLogout, setView, onShowLogin, cartItemCount, onShowCart, onShowChat }) => {

    const [notificationsOpen, setNotificationsOpen] = useState(false);
    const [notifications, setNotifications] = useState([]);
    const menuRef = useRef(null);
    const notificationRef = useRef(null);
    
    const unreadCount = useMemo(() => notifications.filter(n => !n.read).length, [notifications]);

    useEffect(() => {
        if (!currentUser) {
            setNotifications([]);
            return;
        }
        const unsub = db.collection('notifications')
            .where('userId', '==', currentUser.mobile)
            .onSnapshot(snapshot => {
                const notifs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort and limit on the client side to get the latest notifications
                notifs.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                setNotifications(notifs.slice(0, 10));
            });
        return () => unsub();
    }, [currentUser]);

    useEffect(() => {
        const handleClickOutside = (event) => {
            if (menuRef.current && !menuRef.current.contains(event.target)) setMenuOpen(false);
            if (notificationRef.current && !notificationRef.current.contains(event.target)) setNotificationsOpen(false);
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
    }, [menuRef, notificationRef]);

    const handleMenuClick = (view) => {
        setView(view);
        setMenuOpen(false);
    };
    
    const handleOpenNotifications = () => {
        setNotificationsOpen(prev => !prev);
        if (!notificationsOpen) { // Only mark as read when opening
            const unreadIds = notifications.filter(n => !n.read).map(n => n.id);
            if (unreadIds.length > 0) {
                const batch = db.batch();
                unreadIds.forEach(id => {
                    const docRef = db.collection('notifications').doc(id);
                    batch.update(docRef, { read: true });
                });
                batch.commit().catch(err => console.error("Error marking notifications as read:", err));
            }
        }
    };
    
    const handleNotificationClick = (notification) => {
        if (notification.link) setView(notification.link);
        setNotificationsOpen(false);
    };

    return (
        <header className="header">
            <div className="header-content">
                <h1 className="logo" onClick={() => setView('home')}>Navrose</h1>

                    </button>
                     <button className="header-icon-btn" title="Flash Offers" onClick={() => setView('flashOffers')}>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"></path></svg>
                    </button>
                    <button className="header-icon-btn cart-btn" title="Cart" onClick={onShowCart}>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>

// --- AUTHENTICATION PAGE ---
const LoginPage = ({ onLoginSuccess, onCancel, showToast }) => {
    const [name, setName] = useState('');
    const [mobile, setMobile] = useState('');
    const [loading, setLoading] = useState(false);

    const handleLogin = async () => {
        if (name.trim().length < 3) {
            showToast('Please enter a valid name (at least 3 characters).', 'error');
            return;
        }
        if (mobile.length !== 10 || !/^\d{10}$/.test(mobile)) {
            showToast('Please enter a valid 10-digit mobile number.', 'error');
            return;
        }

        setLoading(true);
        try {
            const phoneNumber = `+91${mobile}`;
            const userDocRef = db.collection('users').doc(phoneNumber);
            const userDoc = await userDocRef.get();
            
            if (userDoc.exists) {
                const data = userDoc.data();
                if (data && data.name !== name) {
                     await userDocRef.update({ name });
                }
                onLoginSuccess({ name, mobile: phoneNumber }, 'Login successful. Welcome back!');

            } else {
                await userDocRef.set({
                    name: name,
                    mobile: phoneNumber,
                    role: 'user',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                onLoginSuccess({ name, mobile: phoneNumber }, 'Registration successful! Welcome to Navrose.');
            }

        } catch (err) {
            showToast('An error occurred. Please try again.', 'error');
            console.error(err);
            setLoading(false);
        }
    };

    return (
        <div className="modal-overlay">
            <div className="modal-content auth-modal">
                <button className="modal-close-btn" onClick={onCancel}>&times;</button>
                <h2>Welcome to Navrose</h2>
                <p>Enter your name and number to continue</p>
                <div className="form-group">
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Enter your name" />
                </div>
                <div className="form-group">
                    <input type="tel" value={mobile} onChange={(e) => setMobile(e.target.value)} placeholder="Enter 10-digit mobile number" maxLength={10}/>
                </div>
                <div className="form-group">
                    <button onClick={handleLogin} disabled={loading || name.length < 3 || mobile.length !== 10}>
                        {loading ? 'Processing...' : 'Login / Sign Up'}
                    </button>
                </div>
            </div>
        </div>
    );
};

const ProductCard = ({ item, onAddToCart, type }) => {

                alert('Contact information for this freelancer is not available.');

        } else {
            // This is for 'marketplace' and 'kitchen'
            onAddToCart(item);

    const getButtonText = () => {
        if (isFreelance) return 'Contact Freelancer';
        if (type === 'kitchen') return 'Order Now';
        return 'Add to Cart';

    return (
        <div className="product-card">
            <img src={item.imageBase64 || 'https://via.placeholder.com/300'} alt={item.title || item.name} className="product-image" />

    );

        if (currentUser && currentUser.name) {
            setName(currentUser.name);
        }
    }, [currentUser]);

    const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
            await db.collection('freelanceProfiles').add({
                name,
                title,
                price, // Price is a string for flexibility (e.g., "500/hr")
                imageBase64,
                user: currentUser.mobile,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Freelance profile submitted for approval!');
            onProfilePosted();
        } catch (error) {
            console.error("Error posting freelance profile: ", error);
            alert('Failed to post profile.');
        } finally {
            setLoading(false);
        }
    };
    
    const handleFileChange = async (e) => {
        if (e.target.files && e.target.files[0]) {
            const base64 = await compressImageToBase64(e.target.files[0]);
            setImageBase64(base64);
        }
    };

    return (
        <main className="main-content">
            <div className="form-container">
                <h2>Create Your Freelance Profile</h2>
                <form onSubmit={handleSubmit}>
                    <div className="form-group">
                        <label>Full Name</label>
                        <input type="text" value={name} onChange={e => setName(e.target.value)} required />
                    </div>
                    <div className="form-group">
                        <label>Service Title (e.g., Graphic Designer)</label>
                        <input type="text" value={title} onChange={e => setTitle(e.target.value)} required />
                    </div>
                    <div className="form-group">
                        <label>Rate (e.g., ₹500/hour, ₹2000/project)</label>
                        <input type="text" value={price} onChange={e => setPrice(e.target.value)} required />
                    </div>
                    <div className="form-group">
                        <label>Profile Image or Portfolio Sample</label>
                        <input type="file" accept="image/*" onChange={handleFileChange} required />
                        {imageBase64 && <img src={imageBase64} alt="Preview" className="image-preview" />}
                    </div>
                    <button type="submit" className="btn-primary" disabled={loading}>{loading ? 'Submitting...' : 'Submit for Approval'}</button>
                </form>
            </div>
        </main>
    );
};

const MyAdsPage = ({ currentUser }) => {
    const [myAds, setMyAds] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchAds = async () => {
            if (!currentUser || !currentUser.mobile) {
                setLoading(false);
                return;
            }
            try {
                const snapshot = await db.collection('ads').where('user', '==', currentUser.mobile).get();
                const adsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                adsData.sort((a, b) => ((b.createdAt && b.createdAt.toMillis()) || 0) - ((a.createdAt && a.createdAt.toMillis()) || 0));
                setMyAds(adsData);
            } catch (error) { console.error("Error fetching my ads: ", error); }
            finally { setLoading(false); }
        };
        fetchAds();
    }, [currentUser]);

    if (loading) return <LoadingSpinner />;

    return (
        <main className="main-content">
            <h2>My Ads</h2>
            <div className="list-container">
                {myAds.length === 0 ? <p>You haven't posted any ads yet.</p> :
                    myAds.map(ad => (
                        <div key={ad.id} className="list-item">
                            <img src={ad.imageBase64 || 'https://via.placeholder.com/100'} alt={ad.title} />
                            <div className="item-details">
                                <h4>{ad.title}</h4>
                                <p>Price: ₹{ad.price}</p>
                            </div>
                            <span className={`status-badge status-${ad.status}`}>{ad.status}</span>
                        </div>
                    ))
                }
            </div>
        </main>
    );
};

const MyFreelanceProfilePage = ({ currentUser, setView }) => {
    const [profile, setProfile] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchProfile = async () => {
            if (!currentUser || !currentUser.mobile) {
                setLoading(false); return;
            }
            try {
                const snapshot = await db.collection('freelanceProfiles')
                    .where('user', '==', currentUser.mobile).limit(1).get();
                if (!snapshot.empty) {
                    setProfile({ id: snapshot.docs[0].id, ...snapshot.docs[0].data() });
                }
            } catch (error) { console.error("Error fetching freelance profile: ", error); }
             finally { setLoading(false); }
        };
        fetchProfile();
    }, [currentUser]);

    if (loading) return <LoadingSpinner />;

    return (
        <main className="main-content">
            <h2>My Freelance Profile</h2>
            <div className="list-container">
                {profile ? (
                    <div className="list-item">
                        <img src={profile.imageBase64 || 'https://via.placeholder.com/100'} alt={profile.name} />
                        <div className="item-details">
                            <h4>{profile.name}</h4>
                            <p>Service: {profile.title}</p>
                            <p>Rate: {profile.price}</p>
                        </div>
                        <span className={`status-badge status-${profile.status}`}>{profile.status}</span>

const MyOrdersPage = ({ currentUser }) => {
    const [orders, setOrders] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        if (!currentUser || !currentUser.mobile) {
            setLoading(false);
            return;
        }

        const fetchOrders = async () => {
            try {
                const snapshot = await db.collection('kitchenOrders')
                    .where('user', '==', currentUser.mobile)
                    .get();
                
                const ordersData = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                }));

                ordersData.sort((a, b) => ((b.createdAt && b.createdAt.toMillis()) || 0) - ((a.createdAt && a.createdAt.toMillis()) || 0));

                setOrders(ordersData);
            } catch (error) {
                console.error("Error fetching orders: ", error);
            } finally {
                setLoading(false);
            }
        };

        fetchOrders();
    }, [currentUser]);

    if (loading) return <LoadingSpinner />;

    return (
        <main className="main-content">
            <h2>My Orders</h2>
            <div className="list-container">
                {orders.length === 0 ? (
                    <p>You have no past orders.</p>
                ) : (
                    orders.map(order => (
                        <div key={order.id} className="order-list-item">
                            <div className="order-header">
                                <div>
                                    <h4>Order ID: {order.id.substring(0, 8).toUpperCase()}</h4>
                                    <p>Placed on: {order.createdAt && order.createdAt.toDate().toLocaleDateString('en-IN', {
                                        day: 'numeric', month: 'long', year: 'numeric'
                                    })}</p>
                                </div>
                                <div className="order-summary">
                                    <span className={`status-badge status-${order.status}`}>{order.status}</span>
                                    <p className="order-total">Total: ₹{(order.total || 0).toFixed(2)}</p>
                                </div>
                            </div>
                            <ul className="order-items">
                                {(order.items || []).map((item, index) => (
                                    <li key={index} className="order-item-detail">
                                        <span>{item.title || 'Unnamed Item'} (x{item.quantity || 1})</span>
                                        <span>₹{((item.price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    ))
                )}
            </div>
        </main>
    );
};

const CartPage = ({ cart, onUpdateQuantity, onRemove, onConfirm, onCancel, isSubmitting }) => {
    const subtotal = useMemo(() => cart.reduce((total, item) => total + ((item.price || 0) * (item.quantity || 1)), 0), [cart]);

    return (
        <div className="modal-overlay">
            <div className="cart-modal-content">
                <div className="cart-header">
                    <h2>Your Cart</h2>
                    <button className="modal-close-btn" onClick={onCancel}>&times;</button>
                </div>
                {cart.length === 0 ? (
                    <p className="empty-cart-message">Your cart is empty.</p>
                ) : (
                    <>
                        <div className="cart-items-list">
                            {cart.map(item => (
                                <div className="cart-item" key={item.id}>
                                    <img src={item.imageBase64 || 'https://via.placeholder.com/100'} alt={item.title || item.name} />
                                    <div className="cart-item-info">
                                        <h4>{item.title || item.name}</h4>
                                        <p>₹{item.price}</p>
                                    </div>
                                    <div className="cart-item-actions">
                                        <div className="quantity-control">
                                            <button onClick={() => onUpdateQuantity(item.id, item.quantity - 1)} disabled={item.quantity <= 1}>-</button>
                                            <span>{item.quantity}</span>
                                            <button onClick={() => onUpdateQuantity(item.id, item.quantity + 1)}>+</button>
                                        </div>
                                        <button className="btn-remove" onClick={() => onRemove(item.id)}>Remove</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="cart-summary">
                            <h3>Subtotal: ₹{subtotal.toFixed(2)}</h3>
                            <button className="btn-primary" onClick={onConfirm} disabled={isSubmitting}>
                                {isSubmitting ? 'Proceeding...' : 'Confirm Order'}
                            </button>
                        </div>
                    </>
                )}
            </div>
        </div>
    );
};


// --- MAIN APP COMPONENT ---
const App = () => {
    const [currentUser, setCurrentUser] = useState(null);
    const [loading, setLoading] = useState(true);
    const [view, setView] = useState('home');
    const [showLogin, setShowLogin] = useState(false);
    const [actionQueue, setActionQueue] = useState(null);
    const [cart, setCart] = useState([]);
    const [showCart, setShowCart] = useState(false);
    const [showChatbot, setShowChatbot] = useState(false);
    const [showPaymentModal, setShowPaymentModal] = useState(false);
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [orderConfirmation, setOrderConfirmation] = useState({ show: false, message: '' });
    const [paymentSettings, setPaymentSettings] = useState({ upiId: '7696272780@okbizaxis', qrCodeBase64: null });
    const [toast, setToast] = useState({ show: false, message: '', type: '' });


    useEffect(() => {
        try {
            const storedUser = localStorage.getItem('navroseUser');
            if (storedUser) {
                setCurrentUser(JSON.parse(storedUser));
            }
        } catch (error) {
            console.error("Failed to parse user from localStorage", error);
            localStorage.removeItem('navroseUser');
        } finally {
             setLoading(false);
        }

        const fetchPaymentSettings = async () => {
            try {
                const docRef = db.collection('settings').doc('payment');
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    // Ensure both fields exist to prevent errors
                    setPaymentSettings({
                        upiId: data.upiId || '7696272780@okbizaxis',
                        qrCodeBase64: data.qrCodeBase64 || null
                    });
                }
            } catch (error) {
                console.error("Could not fetch payment settings, using default.", error);
            }
        };
        fetchPaymentSettings();
    }, []);
    
    const showToast = (message, type = 'info') => {
        setToast({ show: true, message, type });
    };
    const hideToast = () => {
        setToast(prev => ({ ...prev, show: false }));
    };

    const handleLogout = () => {
        localStorage.removeItem('navroseUser');
        setCurrentUser(null);
        setView('home');
    };
    
    const handleLoginSuccess = (user, successMessage) => {
        localStorage.setItem('navroseUser', JSON.stringify(user));
        setCurrentUser(user);
        setShowLogin(false);
        if (successMessage) {
            showToast(successMessage, 'success');
        }
        
        if (actionQueue) {
            actionQueue();
            setActionQueue(null);
        }
    };

    const handleAddToCart = (item) => {
        setCart(prevCart => {
            const existingItem = prevCart.find(cartItem => cartItem.id === item.id);
            if (existingItem) {
                showToast(`${item.title || item.name} is already in your cart.`, 'info');
                return prevCart;
            }
            showToast(`${item.title || item.name} added to cart!`, 'success');
            return [...prevCart, { ...item, quantity: 1 }];
        });
    };

    const handleUpdateCartQuantity = (itemId, newQuantity) => {
        if (newQuantity < 1) return;
        setCart(prevCart => prevCart.map(item => item.id === itemId ? { ...item, quantity: newQuantity } : item));
    };

    const handleRemoveFromCart = (itemId) => {
        setCart(prevCart => prevCart.filter(item => item.id !== itemId));
    };

    const handleConfirmOrder = () => {
        if (!currentUser) {
            setActionQueue(() => () => handleConfirmOrder());
            setShowCart(false);
            setShowLogin(true);
            return;
        }

        if (cart.length === 0) {
            setOrderConfirmation({ show: true, message: "Your cart is empty." });
            return;
        }

        setShowCart(false);
        setShowPaymentModal(true);
    };

    const handleSubmitOrderWithProof = async (paymentProofBase64) => {
        if (!paymentProofBase64) {
            alert("Please upload payment proof to continue.");
            return;
        }

        setIsSubmitting(true);
        try {
            const order = {
                user: currentUser.mobile,
                userName: currentUser.name,
                items: cart.map(item => ({ id: item.id, title: item.title || item.name, price: item.price, quantity: item.quantity })),
                total: cart.reduce((total, item) => total + ((item.price || 0) * (item.quantity || 1)), 0),
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                paymentProofImage: paymentProofBase64,
            };
            await db.collection('kitchenOrders').add(order);
            
            setCart([]);
            setShowPaymentModal(false);
            setOrderConfirmation({ show: true, message: 'Your order and payment proof have been submitted! We will verify it and confirm your order shortly.' });
        } catch (error) {
            console.error("Error placing order: ", error);
            setOrderConfirmation({ show: true, message: "Failed to place order. Please try again." });
        } finally {
            setIsSubmitting(false);
        }
    };


    const renderView = () => {
        switch (view) {
            case 'postAd':
                return <PostAdPage currentUser={currentUser} onAdPosted={() => setView('myAds')} />;
            case 'postFreelance':
                return <PostFreelancePage currentUser={currentUser} onProfilePosted={() => setView('myFreelanceProfile')} />;
            case 'myAds':
                return <MyAdsPage currentUser={currentUser} />;
            case 'myFreelanceProfile':
                return <MyFreelanceProfilePage currentUser={currentUser} setView={setView} />;
            case 'myOrders':
                return <MyOrdersPage currentUser={currentUser} />;
            case 'kitchen':
                return <KitchenPage onAddToCart={handleAddToCart} />;
            case 'flashOffers':
                return <FlashOffersPage />;
            default:
                return <HomePage onAddToCart={handleAddToCart} />;
        }
    };
    
    if (loading) {
        return <LoadingSpinner />;
    }

    return (
        <div id="app-container">
            <Header 
                currentUser={currentUser} 
                onLogout={handleLogout} 
                setView={setView} 
                onShowLogin={() => setShowLogin(true)}
                cartItemCount={cart.length}
                onShowCart={() => setShowCart(true)}
                onShowChat={() => setShowChatbot(true)}
            />
            {renderView()}
            {showLogin && <LoginPage onLoginSuccess={handleLoginSuccess} onCancel={() => {setShowLogin(false); setActionQueue(null);}} showToast={showToast} />}
            {showCart && <CartPage cart={cart} onUpdateQuantity={handleUpdateCartQuantity} onRemove={handleRemoveFromCart} onConfirm={handleConfirmOrder} onCancel={() => setShowCart(false)} isSubmitting={isSubmitting} />}
            {showChatbot && <ChatbotModal show={showChatbot} onClose={() => setShowChatbot(false)} />}
            {showPaymentModal && <PaymentModal show={showPaymentModal} onCancel={() => setShowPaymentModal(false)} cart={cart} onSubmit={handleSubmitOrderWithProof} isSubmitting={isSubmitting} paymentSettings={paymentSettings} />}
            <OrderConfirmationModal show={orderConfirmation.show} message={orderConfirmation.message} onClose={() => setOrderConfirmation({ show: false, message: '' })} />
            <Toast show={toast.show} message={toast.message} type={toast.type} onHide={hideToast} />
        </div>
    );
};

const rootElement = document.getElementById('root');
if (rootElement) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
}
    </script>
